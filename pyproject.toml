[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-agent"
version = "0.1.0"
description = "An AI agent specialized in handling, processing, and analyzing large amounts of data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Evan", email = "evan@example.com"}
]

dependencies = [
    # Agent runtime. openai-agents pulls in openai, pydantic, requests and mcp.
    "openai>=2.7.1",
    "openai-agents>=0.5.0",
    "pydantic>=2.12.3,<3",
    "python-dotenv>=1.1.1",

    # Data processing and plotting
    "pandas>=2.2.3",
    "matplotlib>=3.10.3",

    # pandas reads and writes Excel through optional extras, so these engines
    # have to be declared here or read_excel/to_excel fail at runtime.
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "xlsxwriter>=3.2.5",

    # Database access for execute_query. psycopg2-binary is the driver for the
    # PostgreSQL service in docker-compose.yml.
    "sqlalchemy>=2.0.41",
    "psycopg2-binary>=2.9.10",

    # Kaggle search and download
    "kaggle>=1.6.16",
    "kagglehub>=0.3.13",

    # HTTP layer for backend/server.py
    "fastapi>=0.115.12",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "black>=23.0",
    "flake8>=6.0",
]

[tool.uv]
managed = true

# The source lives in backend/ but imports itself flat (`from agent_tools import ...`),
# so ship backend/'s contents at the wheel root rather than as a `backend` package.
# Without this, hatchling can't find a module matching the project name and the
# editable install in the Dockerfile fails.
[tool.hatch.build.targets.wheel]
only-include = ["backend"]
sources = ["backend"]
